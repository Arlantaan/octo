# Host Nginx site for octopustech.org. It sits beside the existing Trust Quality Designs site and
# forwards to the OctopusTech web container on loopback. Certbot adds the HTTPS blocks.
#
#   sudo cp deploy/nginx/octopustech.org.conf /etc/nginx/sites-available/octopustech.org
#   sudo ln -s /etc/nginx/sites-available/octopustech.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d octopustech.org -d www.octopustech.org

server {
    listen 80;
    listen [::]:80;
    server_name octopustech.org www.octopustech.org;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the visitor's own X-Forwarded-For header is discarded, so the
        # AI rate limits always see the real address and cannot be dodged with a forged header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Octo streams replies as server-sent events: never buffer them
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
